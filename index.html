<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ХПВТП «АЛМАЗ» — будівництво та нерухомість | Хмельницький</title>
  <meta name="description" content="ХПВТП «АЛМАЗ» (м. Хмельницький): будівництво багатоквартирних і приватних будинків, девелопмент міських земельних ділянок у співпраці, оренда складських приміщень різних площ, інженерна інфраструктура кооперативу «Алмазний»." />
  <meta name="theme-color" content="#071a33" />

  <style>
    :root{
      --bg:#050f1f;
      --card:rgba(255,255,255,.04);
      --card2:rgba(255,255,255,.03);
      --line:rgba(255,255,255,.14);
      --text:#eef3ff;
      --muted:rgba(238,243,255,.72);
      --accent:#9fb8ff;
      --shadow: 0 18px 46px rgba(0,0,0,.38);
      --r14:14px;
      --r18:18px;
      --r24:24px;
      --container: 1140px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      line-height: 1.55;
      background:
        radial-gradient(900px 520px at 8% -10%, rgba(159,184,255,.20), transparent 60%),
        radial-gradient(760px 520px at 92% 0%, rgba(159,184,255,.12), transparent 55%),
        linear-gradient(180deg, var(--bg), #040d18 65%, #030913);
    }

    a{color:inherit;text-decoration:none}
    .container{max-width:var(--container);margin:0 auto;padding:0 18px}

    .header{
      position:sticky; top:0; z-index:50;
      background: rgba(5,15,31,.82);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
    }
    .header__inner{
      display:flex; align-items:center; justify-content:space-between;
      gap:14px; padding:12px 0;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      min-width: 240px;
    }
    .brand__logo{
      width:46px; height:46px; object-fit:contain; display:block;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.35));
    }
    .brand__name{font-weight:950; letter-spacing:.2px}
    .brand__tag{font-size:12px; color:var(--muted); margin-top:2px}

    .nav{
      display:flex; align-items:center; gap:18px;
    }
    .nav a{
      color:var(--muted);
      font-weight:900;
      padding:10px 10px;
      border-radius: 12px;
    }
    .nav a:hover{
      color:var(--text);
      background: rgba(255,255,255,.03);
    }

    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:12px 16px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.18);
      background: linear-gradient(180deg, rgba(159,184,255,.18), rgba(255,255,255,.04));
      box-shadow: 0 12px 26px rgba(0,0,0,.26);
      font-weight:950;
      transition: transform .15s ease, filter .15s ease;
      white-space:nowrap;
    }
    .btn:hover{transform:translateY(-1px); filter:brightness(1.03)}
    .btn--ghost{
      background: rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:none;
    }
    .btn--sm{padding:10px 12px;border-radius:12px;font-size:14px}

    .nav__toggle{
      display:none;
      width:44px; height:44px;
      border-radius: 12px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      cursor:pointer;
    }
    .nav__toggle span{
      display:block; height:2px;
      background: var(--text);
      margin:7px 10px; border-radius: 2px;
    }

    .hero{padding:58px 0 28px}
    .hero__grid{
      display:grid;
      grid-template-columns: 1.25fr .85fr;
      gap:16px;
      align-items:stretch;
    }
    .kicker{
      display:inline-flex;
      padding:7px 11px;
      border-radius: 999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font-weight:950;
      font-size:12px;
    }
    h1{
      font-size:44px;
      line-height:1.08;
      margin:14px 0 12px;
      letter-spacing:-.3px;
    }
    .accent{color: var(--accent)}
    .lead{color: var(--muted); font-size:16px; max-width: 72ch}
    .hero__cta{display:flex; gap:12px; flex-wrap:wrap; margin:18px 0 10px}

    .card{
      border:1px solid var(--line);
      background: linear-gradient(180deg, var(--card), rgba(255,255,255,.02));
      border-radius: var(--r24);
      padding:20px;
      box-shadow: var(--shadow);
    }

    .hero__facts{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:10px;
      margin-top: 12px;
    }
    .fact{
      border:1px solid var(--line);
      background: var(--card2);
      border-radius: var(--r18);
      padding:14px;
    }
    .fact__title{font-weight:950; font-size:14px}
    .fact__text{color:var(--muted); font-size:12px; margin-top:6px}

    .section{padding:44px 0}
    .section--alt{
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 62%);
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
    }
    .section__head{margin-bottom:16px}
    .section__head h2{margin:0 0 6px; font-size:26px; letter-spacing:-.2px}
    .section__head p{margin:0; color:var(--muted)}

    .grid-4{display:grid; grid-template-columns: repeat(4, 1fr); gap:12px}
    .tile{
      border:1px solid var(--line);
      background: var(--card2);
      border-radius: var(--r18);
      padding:16px;
      min-height: 132px;
    }
    .tile h3{margin:0 0 8px; font-size:16px}
    .tile p{margin:0; color:var(--muted); font-size:14px}

    .split{display:grid; grid-template-columns: 1.1fr .9fr; gap:14px; align-items:start}
    .panel{
      border:1px solid var(--line);
      background: var(--card2);
      border-radius: var(--r24);
      padding:20px;
    }
    .pills{display:flex; flex-wrap:wrap; gap:10px; margin:0 0 14px}
    .pill{
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.12);
      font-weight:950;
      font-size:12px;
      color: var(--muted);
    }
    .checklist{margin:0; padding-left:18px; color: var(--muted)}
    .checklist li{margin:10px 0}

    .person{
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius: var(--r18);
      padding:16px;
    }
    .person__title{color: var(--muted); font-weight:950; font-size:12px}
    .person__name{font-weight:950; font-size:18px; margin-top:6px}
    .person__text{color: var(--muted); font-size:14px; margin-top:10px}

    .contact-list{display:grid; gap:12px; margin-top: 8px}
    .contact-item{
      border:1px solid var(--line);
      background: var(--card2);
      border-radius: var(--r18);
      padding:12px;
    }
    .contact-label{color: var(--muted); font-weight:950; font-size:12px}
    .contact-value{font-weight:950; margin-top:6px}
    .contact-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}

    .map{
      border:1px solid var(--line);
      border-radius: var(--r24);
      overflow:hidden;
      background: rgba(255,255,255,.02);
      box-shadow: var(--shadow);
    }
    .map iframe{width:100%; height:520px; display:block}

    .footer{
      margin-top:28px;
      border-top:1px solid var(--line);
      background: rgba(0,0,0,.16);
    }
    .footer__inner{
      padding:18px 0;
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:14px; flex-wrap:wrap;
    }
    .footer__left{display:flex; align-items:center; gap:10px}
    .footer__logo{width:34px;height:34px;object-fit:contain;display:block;opacity:.95}
    .footer__brand{font-weight:950}
    .footer__muted{color: var(--muted); font-size:12px; margin-top:6px}
    .footer__links{display:flex; gap:14px; flex-wrap:wrap}
    .footer__links a{color:var(--muted); font-weight:900}
    .footer__links a:hover{color:var(--text)}
    .footer__bottom{
      padding:12px 0;
      color: var(--muted);
      font-size:12px;
      border-top:1px solid var(--line);
    }

    @media (max-width:980px){
      .hero__grid{grid-template-columns: 1fr}
      .grid-4{grid-template-columns: 1fr 1fr}
      .split{grid-template-columns: 1fr}
      h1{font-size:38px}
    }
    @media (max-width:720px){
      .nav{display:none; flex-direction:column; align-items:flex-start; gap:8px; width:100%}
      .nav.is-open{display:flex}
      .nav__toggle{display:inline-block}
      .hero__facts{grid-template-columns:1fr}
      .grid-4{grid-template-columns: 1fr}
      .map iframe{height:420px}
    }
  </style>
</head>
